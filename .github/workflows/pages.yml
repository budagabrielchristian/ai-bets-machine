# Publishes the dashboard page when the code changes. The page reads its
# (encrypted) data from the "data" branch, which the AI engine updates every
# 15 minutes (see engine.yml), so it does not need republishing for new data.
name: Dashboard page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build the dashboard
        env:
          VITE_STATIC: '1'
          VITE_DATA_URL: https://raw.githubusercontent.com/${{ github.repository }}/data/data.enc.json
        run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5
